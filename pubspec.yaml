name: sportify
description: "Find sports partners, groups and venues near you."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.5
  firebase_messaging: ^15.2.4

  # Auth
  google_sign_in: ^6.3.0

  # State Management
  provider: ^6.1.4

  # UI & Utils
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  uuid: ^4.5.1
  timeago: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon2.png"